<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>Create Your Vault | NeuroLink Vault</title>

    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="shortcut icon" href="favicon.ico">
    <link rel="stylesheet" href="css/style.css">

</head>


<body class="auth-page">


<header class="navbar">

    <div class="navbar-container">

        <a href="index.html" class="logo">

            <img
                    src="assets/neurolink-logo.png"
                    alt="NeuroLink Vault Logo"
            >

        </a>

        <nav class="nav-links">

            <a href="login.html">
                Already have an account?
            </a>

            <a href="login.html" class="nav-button">
                Sign In
            </a>

        </nav>

    </div>

</header>



<main class="auth-container">

    <section class="auth-card">

        <div class="auth-header">

            <p class="eyebrow">
                START YOUR JOURNEY
            </p>

            <h1>
                Create your vault.
            </h1>

            <p>
                Start preserving the moments
                that matter to you.
            </p>

        </div>


        <form id="registerForm">


            <!-- NAME -->

            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your name"
                        required
                >

            </div>



            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        required
                >

            </div>



            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        minlength="6"
                        required
                >

            </div>



            <!-- CONFIRM PASSWORD -->

            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm your password"
                        minlength="6"
                        required
                >

            </div>



            <!-- ERROR / SUCCESS MESSAGE -->

            <div
                    id="registerMessage"
                    class="form-message"
            ></div>



            <!-- SUBMIT -->

            <button
                    type="submit"
                    class="auth-button"
            >
                Create My Vault
            </button>


        </form>


        <div class="auth-footer">

            Already have an account?

            <a href="login.html">
                Sign in
            </a>

        </div>

    </section>

</main>



<script src="js/api.js"></script>
<script src="js/auth.js"></script>

</body>

</html>
